{% extends 'Admin/Header.html' %}
{% load static %}
{% block content %}

<style>
/* Page Heading */
.page-title {
    text-align: center;
    font-size: 24px;
    font-weight: 600;
    color: #90caf9;
    margin-bottom: 25px;
}

/* Form container */
.content-wrapper form {
    max-width: 500px;
    margin: 50px auto;
    background: #132238;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(0,0,0,0.35);
    color: #cfd8dc;
}

/* Table styles */
.content-wrapper form table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 20px;
}

/* Table borders */
.content-wrapper form table,
.content-wrapper form table td {
    border: 1px solid #1e3a56;
}

/* Table cells */
.content-wrapper form table td {
    padding: 10px;
}

/* Inputs */
.content-wrapper form input[type="text"] {
    width: 100%;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #294b6e;
    background: #0b1727;
    color: #e3f2fd;
}

/* Submit button */
.content-wrapper form input[type="submit"] {
    background: linear-gradient(45deg,#1976d2,#42a5f5);
    border: none;
    padding: 10px 25px;
    color: white;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.25s;
}

.content-wrapper form input[type="submit"]:hover {
    background: linear-gradient(45deg,#42a5f5,#1976d2);
}

/* Responsive */
@media(max-width: 600px) {
    .content-wrapper form {
        padding: 15px;
    }
    .content-wrapper form table td {
        font-size: 14px;
        padding: 6px;
    }
}
</style>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reply to Complaint</title>
</head>
<body>
    <form method="POST">
        <h3 class="page-title">Reply to Complaint</h3>
        {% csrf_token %}
        <table>
            <tr>
                <td>Reply</td>
                <td><input type="text" required placeholder="Enter Reply" name="txt_reply" id=""></td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" name="btn_submit" value="Submit" id="">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>

{% if msg %}
<script>
    alert("{{msg}}");
    window.location="{% url 'Admin:ViewComplaint' %}"
</script>
{% endif %}

{% endblock content %}
