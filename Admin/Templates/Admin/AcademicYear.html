{% extends 'Admin/Header.html' %}
{% load static %}
{% block content %}

<style>
/* Card theme to match Dashtreme */
.card {
  background: #132238;
  border: none;
  border-radius: 12px;
  box-shadow: 0 0 30px rgba(0,0,0,0.35);
}

/* Card title */
.card h3 {
  color: #e3f2fd !important;
  font-weight: 600;
  letter-spacing: 0.5px;
}

/* Labels */
.form-group label {
  color: #90caf9 !important;
  font-size: 13px;
  letter-spacing: 1px;
}

/* Inputs */
.form-control {
  background: #0b1727;
  border: 1px solid #294b6e;
  color: #e3f2fd;
  border-radius: 6px;
}

.form-control:focus {
  background: #0b1727;
  color: #ffffff;
  border-color: #42a5f5;
  box-shadow: 0 0 8px rgba(66,165,245,0.45);
}

/* Submit button */
.btn-primary {
  background: linear-gradient(45deg,#1976d2,#42a5f5);
  border: none;
  font-weight: 600;
  border-radius: 6px;
  transition: 0.25s;
}

.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 14px rgba(66,165,245,0.45);
}

/* Table */
.table {
  background: #0e1a2b;
  border-radius: 8px;
  overflow: hidden;
}

.table thead th {
  background: #0b1727 !important;
  color: #90caf9 !important;
  font-weight: 600;
  border-color: #1e3a56 !important;
}

.table td {
  border-color: #1e3a56 !important;
  vertical-align: middle;
}

/* Delete button */
.btn-danger {
  background: linear-gradient(45deg,#c62828,#ef5350);
  border: none;
  border-radius: 5px;
}

.btn-danger:hover {
  box-shadow: 0 4px 10px rgba(239,83,80,0.4);
}

/* Divider */
hr.bg-light {
  border-top: 1px solid #294b6e;
}
</style>

<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-lg-7">

      <div class="card shadow-lg">
        <div class="card-body">

          <h3 class="text-center mb-4 text-white">Academic Year</h3>

          <form method="POST">
            {% csrf_token %}

            <div class="form-group">
              <label class="text-uppercase text-light font-weight-bold">
              
              </label>
              <input type="text"
                     class="form-control form-control-lg"
                     required
                     placeholder="Enter Academic Year"
                     name="txt_academicyear">
            </div>

            <div class="text-center mt-4">
              <button type="submit"
                      name="btn_submit"
                      class="btn btn-primary px-5">
                Submit
              </button>
            </div>

            <hr class="bg-light">

            <div class="table-responsive mt-3">
              <table class="table table-bordered text-center text-white">
                <thead class="bg-dark">
                  <tr>
                    <th>SINO</th>
                    <th>Academic Year</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody>
                  {% for i in data %}
                  <tr>
                    <td>{{forloop.counter}}</td>
                    <td>{{i.academicyear_year}}</td>
                    <td>
                      <a href="{% url 'Admin:delyear' i.id %}"
                         class="btn btn-danger btn-sm">
                        Delete
                      </a>
                    </td>
                  </tr>
                  {% endfor %}
                </tbody>
              </table>
            </div>

          </form>

        </div>
      </div>

    </div>
  </div>
</div>

{% if msg %}
<script>
alert("{{msg}}");
window.location="{% url 'Admin:AcademicYear' %}"
</script>
{% endif %}

{% endblock content %}
