{% extends 'Admin/Header.html' %}
{% load static %}
{% block content %}

<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-lg-7">

      <div class="card shadow-lg">
        <div class="card-body">

          <h3 class="text-center mb-4 text-white">Academic Year</h3>

          <form method="POST">
            {% csrf_token %}

            <div class="form-group">
              <label class="text-uppercase text-light font-weight-bold">
                Academic Year
              </label>
              <input type="text"
                     class="form-control form-control-lg"
                     required
                     placeholder="Enter Academic Year"
                     name="txt_academicyear">
            </div>

            <div class="text-center mt-4">
              <button type="submit"
                      name="btn_submit"
                      class="btn btn-primary px-5">
                Submit
              </button>
            </div>

            <hr class="bg-light">

            <div class="table-responsive mt-3">
              <table class="table table-bordered text-center text-white">
                <thead class="bg-dark">
                  <tr>
                    <th>SINO</th>
                    <th>Academic Year</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody>
                  {% for i in data %}
                  <tr>
                    <td>{{forloop.counter}}</td>
                    <td>{{i.academicyear_year}}</td>
                    <td>
                      <a href="{% url 'Admin:delyear' i.id %}"
                         class="btn btn-danger btn-sm">
                        Delete
                      </a>
                    </td>
                  </tr>
                  {% endfor %}
                </tbody>
              </table>
            </div>

          </form>

        </div>
      </div>

    </div>
  </div>
</div>

{% if msg %}
<script>
alert("{{msg}}");
window.location="{% url 'Admin:AcademicYear' %}"
</script>
{% endif %}

{% endblock content %}
