{% extends 'Admin/Header.html' %}
{% load static %}
{% block content %}

<style>
/* Page heading */
.page-title {
    text-align: center;
    font-size: 24px;
    font-weight: 600;
    color: #90caf9;
    margin-bottom: 25px;
}

/* Form container */
.content-wrapper form {
    max-width: 600px;
    margin: 30px auto;
    background: #132238;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(0,0,0,0.35);
    color: #cfd8dc;
}

/* Tables */
.content-wrapper form table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 25px;
}

/* Table borders */
.content-wrapper form table,
.content-wrapper form table th,
.content-wrapper form table td {
    border: 1px solid #1e3a56;
}

/* Header row */
.content-wrapper form table tr:first-child {
    background: #0b1727;
    color: #90caf9;
    font-weight: 600;
    text-align: center;
}

/* Cells */
.content-wrapper form table td {
    padding: 10px;
    text-align: center;
}

/* Inputs */
.content-wrapper form input[type="text"] {
    width: 100%;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #294b6e;
    background: #0b1727;
    color: #e3f2fd;
}

/* Submit Button */
.content-wrapper form input[type="submit"] {
    background: linear-gradient(45deg,#1976d2,#42a5f5);
    border: none;
    padding: 10px 25px;
    color: white;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.25s;
}

.content-wrapper form input[type="submit"]:hover {
    background: linear-gradient(45deg,#42a5f5,#1976d2);
}

/* Links */
.content-wrapper form a {
    color: #4fc3f7;
    font-weight: 500;
    text-decoration: none;
}

.content-wrapper form a:hover {
    color: #81d4fa;
    text-decoration: underline;
}

/* Responsive */
@media(max-width: 768px) {
    .content-wrapper form {
        padding: 15px;
    }

    .content-wrapper form table td,
    .content-wrapper form table th {
        font-size: 14px;
        padding: 6px;
    }
}
</style>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Genre</title>
</head>

<body>
    <form method="POST">
        <h3 class="page-title">Manage Book Genre</h3>
        {% csrf_token %}
        
        <!-- Add Genre Table -->
        <table>
            <tr>
                <td>Genre</td>
                <td><input type="text" required placeholder="Enter Book Genre" name="txt_genre" id=""></td>
            </tr>
            <tr>
                <td colspan="2" align="center"><input type="submit" name="btn_submit" id="" value="Submit"></td>
            </tr>
        </table>

        <!-- Existing Genre List -->
        <table>
            <tr>
                <td>SINO</td>
                <td>Genre</td>
                <td>Action</td>
            </tr>
            {% for i in data %}
            <tr>
                <td>{{forloop.counter}}</td>
                <td>{{i.genre_name}}</td>
                <td><a href="{% url 'Admin:delgenre' i.id %}">Delete</a></td>
            </tr>
            {% endfor %}
        </table>
    </form>
</body>
</html>

{% if msg %}
<script>
    alert("{{msg}}");
    window.location="{% url 'Admin:Genre' %}"
</script>
{% endif %}

{% endblock content %}
