{% extends 'Staff/Header.html' %}
{% load static %}
{% block content %}

<section class="section_padding" style="padding-top:120px; padding-bottom:110px;">
    <div class="container">

        <!-- Section Heading -->
        <div class="row justify-content-center mb-5">
            <div class="col-lg-7 text-center">
                <div class="section_tittle">
                    <h2 style="margin-bottom:32px;">Change Password</h2>
                    <p style="margin-top:-20px; font-size:15px; color:#666;">
                        Update your account password securely
                    </p>
                </div>
            </div>
        </div>

        <!-- Change Password Card -->
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card border-0 shadow-sm" style="border-radius:20px;  margin-top:-70px;">
                    <div class="card-body p-4 p-lg-5">

                        <form method="POST">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="txt_oldpassword" class="form-label" style="font-weight:600;">Old Password</label>
                                <input type="password" required pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" 
                                       title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters" 
                                       placeholder="Enter Your Old Password" name="txt_oldpassword" id="txt_oldpassword" 
                                       class="form-control">
                            </div>

                            <div class="mb-3">
                                <label for="txt_newpassword" class="form-label" style="font-weight:600;">New Password</label>
                                <input type="password" required pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" 
                                       title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters" 
                                       placeholder="Enter Your New Password" name="txt_newpassword" id="txt_newpassword" 
                                       class="form-control">
                            </div>

                            <div class="mb-3">
                                <label for="txt_repassword" class="form-label" style="font-weight:600;">Re-Type Password</label>
                                <input type="password" required pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" 
                                       title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters" 
                                       placeholder="Re-Type Password" name="txt_repassword" id="txt_repassword" 
                                       class="form-control">
                            </div>

                            <div class="text-center mt-4">
                                <input type="submit" name="btn_submit" value="Update" class="btn btn_1 px-5">
                            </div>

                        </form>

                    </div>
                </div>
            </div>
        </div>

    </div>
</section>

{% if msg %}
<script>
    alert("{{msg}}");
    window.location="{% url 'Staff:MyProfile' %}";
</script>
{% endif %}

{% endblock content %}
