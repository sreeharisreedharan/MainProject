
<div class="row justify-content-center mt-4">
    <div class="col-lg-10">
        <div class="card border-0 shadow-sm" style="border-radius:20px;">
            <div class="card-body p-4 p-lg-5">

                <h5 style="font-weight:700; margin-bottom:22px;">Class List</h5>

                <div class="table-responsive">
                    <table class="table table-hover align-middle w-100">
                        <thead style="background:#fff7ef;">
                            <tr>
                                <th width="80">SINO</th>
                                <th>Class</th>
                                <th>Academic Year</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for i in classdata %}
                            <tr>
                                <td>{{forloop.counter}}</td>
                                <td>{{i.classid.class_name}}</td>
                                <td>{{i.academicyear.academicyear_year}}</td>
                                <td class="text-end">
                                    <a href="{% url 'Staff:ViewStudents' i.id %}" class="btn btn-sm btn-primary">View Students</a>
                                </td>
                            </tr>
                            {% empty %}
                            <tr>
                                <td colspan="4" class="text-center text-muted py-4">
                                    No classes available
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>
</div>
