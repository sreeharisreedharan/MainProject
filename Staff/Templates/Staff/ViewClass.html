{% extends 'Staff/Header.html' %}
{% load static %}
{% block content %}

<section class="section_padding" style="padding-top:100px; padding-bottom:110px;">
    <div class="container">

        <!-- Section Heading -->
        <div class="row justify-content-center mb-5">
            <div class="col-lg-7 text-center">
                <div class="section_tittle">
                    <h2 style="margin-bottom:32px;">View Class</h2>
                    <p style="margin-top:-20px; font-size:15px; color:#666;">
                        Select course, class, and academic year to view assigned classes
                    </p>
                </div>
            </div>
        </div>

        <!-- Class Selection Card -->
        <div class="row justify-content-center mb-4">
            <div class="col-lg-10">
                <div class="card border-0 shadow-sm" style="border-radius:20px; margin-top:-100px;">
                    <div class="card-body p-4 p-lg-5">

                        <form method="POST">
                            {% csrf_token %}

                            <div class="row g-3">

                                <div class="col-md-4">
                                    <label for="sel_course" class="form-label" style="font-weight:600;">Course</label>
                                    <select required name="sel_course" id="sel_course" class="form-control">
                                        <option value="">Select Course</option>
                                        {% for i in coursedata %}
                                        <option value="{{i.id}}">{{i.course_name}}</option>
                                        {% endfor %}
                                    </select>
                                </div>

                                <div class="col-md-4">
                                    <label for="sel_class" class="form-label" style="font-weight:600;">Class</label>
                                    <select required name="sel_class" id="sel_class" onchange="getClass()" class="form-control">
                                        <option value="">Select Class</option>
                                        <option></option>
                                    </select>
                                </div>

                                <div class="col-md-4">
                                    <label for="sel_academicyear" class="form-label" style="font-weight:600;">Academic Year</label>
                                    <select required name="sel_academicyear" id="sel_academicyear" onchange="getClass()" class="form-control">
                                        <option value="">Select Academic Year</option>
                                        {% for i in academicdata %}
                                        <option value="{{i.id}}">{{i.academicyear_year}}</option>
                                        {% endfor %}
                                    </select>
                                </div>

                            </div>

                        </form>

                    </div>
                </div>
            </div>
        </div>

        <!-- Result Section -->
        <div class="row justify-content-center">
            <div class="col-lg-12">
                <div id="result"></div>
            </div>
        </div>

    </div>
</section>

<!-- jQuery & AJAX -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
$("#sel_course").change(function () {
  var cid = $(this).val();
  var ur = "{% url 'Staff:AjaxClass' %}";
  $.ajax({
    url: ur,
    data: { cid: cid },
    success: function (data) {
      $("#sel_class").html(data);
    },
  });
});

function getClass() {
  var cid = document.getElementById('sel_class').value
  var aid = document.getElementById('sel_academicyear').value
  var ur = "{% url 'Staff:AjaxClasses' %}";
  $.ajax({
    url: ur,
    data: { cid: cid, aid: aid },
    success: function (data) {
      $("#result").html(data);
    },
  });
}
</script>

{% endblock content %}
