{% extends 'User/Header.html' %}
{% load static %}
{% block content %}

<section class="section_padding" style="padding-top:100px; padding-bottom:80px;">
    <div class="container">

        <!-- Title -->
        <div class="row justify-content-center">
            <div class="col-lg-7 text-center">
                <div class="section_tittle mb-4">
                    <h2>Feedback</h2>
                    <p style="margin-top:15px;">
                        Share your feedback and suggestions with us
                    </p>
                </div>
            </div>
        </div>

        <!-- Center Card -->
        <div class="row justify-content-center">
            <div class="col-lg-6">

                <div class="card border-0 shadow-lg" style="border-radius:12px;">
                    <div class="card-body p-5">

                        <form method="POST">
                            {% csrf_token %}

                            <div class="form-group">
                                <label class="font-weight-bold">
                                    Your Feedback
                                </label>
                                <input required
                                       type="text"
                                       name="txt_feedback"
                                       class="form-control"
                                       placeholder="Enter Feedback">
                            </div>

                            <div class="text-center mt-4">
                                <input type="submit"
                                       name="btn_submit"
                                       value="Submit"
                                       class="btn btn_1 px-5">
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>

    </div>
</section>

{% endblock content %}
