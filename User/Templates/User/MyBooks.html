{% extends 'User/Header.html' %}
{% load static %}
{% block content %}

<section class="section_padding" style="padding-top:85px; padding-bottom:90px;">
    <div class="container">

        <!-- Section Heading -->
        <div class="row justify-content-center">
            <div class="col-lg-7 text-center">
                <div class="section_tittle mb-5">
                    <h2 style="margin-bottom:14px;">My Books</h2>
                    <p style="margin-top:8px;">
                        View the list of books issued to your account
                    </p>
                </div>
            </div>
        </div>

        <!-- Books Card -->
        <div class="row justify-content-center">
            <div class="col-lg-7">

                <div class="card shadow-sm border-0" style="border-radius:18px;">
                    <div class="card-body p-4 p-lg-5">

                        <form method="POST">
                            {% csrf_token %}

                            <div class="table-responsive">
                                <table class="table align-middle table-hover">

                                    <thead>
                                        <tr style="background:#fff7ef;">
                                            <th width="90" style="font-weight:600;">SINO</th>
                                            <th style="font-weight:600;">Book Name</th>
                                        </tr>
                                    </thead>

                                    <tbody>
                                        {% for i in data %}
                                        <tr>
                                            <td>
                                                <span class="font-weight-bold">
                                                    {{forloop.counter}}
                                                </span>
                                            </td>

                                            <td>
                                                <span style="font-size:15px;">
                                                    {{i.book.book_title}}
                                                </span>
                                            </td>
                                        </tr>
                                        {% empty %}
                                        <tr>
                                            <td colspan="2" class="text-center text-muted py-4">
                                                No books currently issued
                                            </td>
                                        </tr>
                                        {% endfor %}
                                    </tbody>

                                </table>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>

    </div>
</section>

{% endblock content %}
