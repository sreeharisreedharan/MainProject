{% extends 'User/Header.html' %}
{% load static %}
{% block content %}

<section class="section_padding" style="padding-top:110px; padding-bottom:80px;">
    <div class="container">

        <!-- Title -->
        <div class="row justify-content-center">
            <div class="col-lg-6 text-center">
                <div class="section_tittle mb-4">
                    <h2>Change Password</h2>
                    <p style="margin-top:15px;">Update your account password securely</p>
                </div>
            </div>
        </div>

        <!-- Center Form -->
        <div class="row justify-content-center">
            <div class="col-lg-6">

                <div class="card border-0 shadow-lg" style="border-radius:12px;">
                    <div class="card-body p-5">

                        <form method="POST">
                            {% csrf_token %}

                            <div class="form-group">
                                <label class="font-weight-bold">Old Password</label>
                                <input required
                                       type="password"
                                       class="form-control"
                                       placeholder="Enter Your Old Password"
                                       name="txt_oldpassword"
                                       pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                                       title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters">
                            </div>

                            <div class="form-group mt-3">
                                <label class="font-weight-bold">New Password</label>
                                <input required
                                       type="password"
                                       class="form-control"
                                       placeholder="Enter Your New Password"
                                       name="txt_newpassword"
                                       pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                                       title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters">
                            </div>

                            <div class="form-group mt-3">
                                <label class="font-weight-bold">Re-Type Password</label>
                                <input required
                                       type="password"
                                       class="form-control"
                                       placeholder="Re-Type your Password"
                                       name="txt_repassword"
                                       pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                                       title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters">
                            </div>

                            <!-- Buttons -->
                            <div class="text-center mt-4">
                                <input type="submit"
                                       name="btn_submit"
                                       value="Change Password"
                                       class="btn btn_1 px-4 mr-2">

                                <input type="reset"
                                       name="btn_submit"
                                       value="Cancel"
                                       class="btn btn-outline-secondary px-4">
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>

    </div>
</section>

{% if msg %}
<script>
    alert("{{msg}}");
    window.location="{% url 'User:MyProfile' %}"
</script>
{% endif %}

{% endblock content %}
